version: 2
updates:
  # Dev dependencies in pyproject.toml / uv.lock (the tools themselves have none)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build"

  # Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
