name: Check CRC PDF Updates

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:      # Manual trigger for testing

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need to commit log file
      issues: write    # Need to create issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for PDF updates
        id: check
        run: python3 check_for_updates.py
        continue-on-error: true

      - name: Log check result
        run: |
          timestamp=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [ "${{ steps.check.outcome }}" == "success" ]; then
            echo "$timestamp - All files up to date" >> check_for_updates.log
          else
            echo "$timestamp - Updates detected or issues found" >> check_for_updates.log
          fi

      - name: Commit log file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add check_for_updates.log
          git diff --quiet && git diff --staged --quiet || git commit --no-verify -m "chore: update PDF check log [skip ci]"
          git push

      - name: Create issue if updates found
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timestamp=$(date -u '+%Y-%m-%d')
          gh issue create \
            --title "New CRC questionnaire PDFs available - $timestamp" \
            --body "A new version of the ham radio questionnaire has been published by CRC on $timestamp.

          Please update the questions in the lzradio application accordingly.

          **CRC PDF Files:**
          https://crc.bg/files/URChS/Radioamateur/

          **Files to check:**
          - class_1_razdel_1.pdf
          - class_1_razdel_2.pdf
          - class_1_razdel_3.pdf
          - class_2_razdel_1.pdf
          - class_2_razdel_2.pdf
          - class_2_razdel_3.pdf

          See the extraction workflow in CLAUDE.md for detailed instructions."
