name: Check CRC PDF Updates

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily (GitHub may start it a few hours late)
  workflow_dispatch:      # Manual trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: check-pdf-updates
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Install first, so a uv failure fails the run instead of being
      # mistaken for an exit code of the checker below.
      - name: Install project
        run: uv sync --locked --no-dev

      # Exit codes: 0 = up to date, 1 = update available, 2 = check failed.
      # A failed check fails the run, so GitHub emails a failure notification.
      - name: Check for PDF updates
        id: check
        env:
          NO_COLOR: '1'
        run: |
          set +e
          uv run --no-sync lzradio-check-updates | tee report.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::Update check failed (exit code $code) - see the log above"
            exit 1
          fi

      - name: Upload downloaded PDFs
        id: upload
        if: steps.check.outputs.code == '1'
        uses: actions/upload-artifact@v7
        with:
          name: crc-pdfs
          path: downloads/
          retention-days: 30

      # The issue is assigned to the repository owner and mentions them, so
      # GitHub sends an email regardless of the repository watch settings.
      - name: Open issue if updates found
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          label="pdf-update"
          gh label create "$label" --color FBCA04 \
            --description "CRC published new exam PDFs" --force

          open=$(gh issue list --state open --label "$label" --json number --jq length)
          if [ "$open" -gt 0 ]; then
            echo "An open '$label' issue already exists - not creating another one."
            exit 0
          fi

          {
            echo "@$OWNER The CRC has published PDFs that differ from \`source_pdfs/\`."
            echo
            echo "- Downloaded PDFs: $ARTIFACT_URL (kept 30 days)"
            echo "- Workflow run: $RUN_URL"
            echo "- Source: https://crc.bg/bg/rubriki/143/testove-za-provejdane-na-izpiti-za-pravosposobnost-na-radiolubiteli"
            echo
            echo "Next steps: review the new PDFs, copy them to \`source_pdfs/\`,"
            echo "re-extract the affected questions (see docs/extraction-guide.md) and close this issue."
            echo
            echo '```'
            cat report.txt
            echo '```'
          } > body.md

          gh issue create \
            --title "New CRC questionnaire PDFs available ($(date -u '+%Y-%m-%d'))" \
            --body-file body.md \
            --label "$label" \
            --assignee "$OWNER"
